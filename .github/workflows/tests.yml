name: Test PEM module
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  TARGET: x86_64-unknown-linux-gnu
  DEBUG: true
# Jobs only check out code, compile or run tests, and exchange binaries as
# run artifacts; keep the GITHUB_TOKEN minimal.
permissions:
  contents: read
jobs:
  # Compile every supported library once; the test jobs below download the
  # binaries as artifacts instead of rebuilding them per Node version.
  build:
    name: Build ${{ matrix.library.name }} ${{ matrix.library.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        library:
          # Supported floors: OpenSSL >= 1.1.1 (first release with
          # `pkey -check`), LibreSSL >= 3.0 (first with EC parameter
          # generation via `genpkey -genparam`). Every entry below is the
          # latest patch of its release line, so each line is covered.
          - name: openssl
            version: 1.1.1w
          - name: openssl
            version: 3.0.22
          - name: openssl
            version: 3.1.8
          - name: openssl
            version: 3.2.6
          - name: openssl
            version: 3.3.7
          - name: openssl
            version: 3.4.8
          - name: openssl
            version: 3.5.9
          - name: openssl
            version: 4.0.3
          - name: openssl
            version: 4.1.0
          - name: libressl
            version: 3.0.2
          - name: libressl
            version: 3.1.5
          - name: libressl
            version: 3.2.7
          - name: libressl
            version: 3.3.6
          - name: libressl
            version: 3.4.3
          - name: libressl
            version: 3.5.4
          - name: libressl
            version: 3.6.3
          - name: libressl
            version: 3.7.3
          - name: libressl
            version: 3.8.4
          - name: libressl
            version: 3.9.2
          - name: libressl
            version: 4.0.1
          - name: libressl
            version: 4.1.2
          - name: libressl
            version: 4.2.3
          - name: libressl
            version: 4.3.4
          - name: libressl
            version: 4.4.0
    steps:
    - uses: actions/checkout@v7
    - name: Compile ${{ matrix.library.name }} ${{ matrix.library.version }}
      shell: bash
      run: |
        set +e
        set -x
        echo $PWD
        openssl version
        ./bin/build-openssl.sh
      env:
        LIBRARY: ${{ matrix.library.name }}
        VERSION: ${{ matrix.library.version }}
    - name: Verify the compiled binary runs
      shell: bash
      run: |
        set -e
        openssl/"${{ matrix.library.name }}_v${{ matrix.library.version }}"/bin/openssl version
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.library.name }}_v${{ matrix.library.version }}
        path: openssl/${{ matrix.library.name }}_v${{ matrix.library.version }}/
        retention-days: 1

  test:
    name: Test PEM (Node ${{ matrix.node }}, ${{ matrix.library.name }} ${{ matrix.library.version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        library:
          # Must mirror the build job matrix above.
          - name: openssl
            version: 1.1.1w
          - name: openssl
            version: 3.0.22
          - name: openssl
            version: 3.1.8
          - name: openssl
            version: 3.2.6
          - name: openssl
            version: 3.3.7
          - name: openssl
            version: 3.4.8
          - name: openssl
            version: 3.5.9
          - name: openssl
            version: 4.0.3
          - name: openssl
            version: 4.1.0
          - name: libressl
            version: 3.0.2
          - name: libressl
            version: 3.1.5
          - name: libressl
            version: 3.2.7
          - name: libressl
            version: 3.3.6
          - name: libressl
            version: 3.4.3
          - name: libressl
            version: 3.5.4
          - name: libressl
            version: 3.6.3
          - name: libressl
            version: 3.7.3
          - name: libressl
            version: 3.8.4
          - name: libressl
            version: 3.9.2
          - name: libressl
            version: 4.0.1
          - name: libressl
            version: 4.1.2
          - name: libressl
            version: 4.2.3
          - name: libressl
            version: 4.3.4
          - name: libressl
            version: 4.4.0
    steps:
    - uses: actions/checkout@v7
    - run: |
        sudo apt-get install -y haveged ca-certificates
        sudo haveged -w 2048
    - name: Download ${{ matrix.library.name }} ${{ matrix.library.version }}
      uses: actions/download-artifact@v4
      with:
        name: ${{ matrix.library.name }}_v${{ matrix.library.version }}
        path: openssl
    - name: Verify the downloaded binary runs
      shell: bash
      run: |
        set -e
        openssl/"${{ matrix.library.name }}_v${{ matrix.library.version }}"/bin/openssl version
    - name: Use Node.js ${{ matrix.node }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
        cache: yarn
    - name: Run Tests
      shell: bash
      run: |
        yarn install
        yarn run test
      env:
        LIBRARY: ${{ matrix.library.name }}
        VERSION: ${{ matrix.library.version }}

  # The FIPS-capable build is a separate shared build (enable-fips), so it
  # cannot reuse the static artifacts above.
  build-fips:
    name: Build FIPS-capable OpenSSL ${{ matrix.openssl.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openssl:
          - version: 3.5.9
    steps:
    - uses: actions/checkout@v7
    - name: Compile FIPS-capable OpenSSL ${{ matrix.openssl.version }}
      shell: bash
      run: |
        set +e
        set -x
        openssl version
        ./bin/build-openssl.sh
      env:
        LIBRARY: openssl
        VERSION: ${{ matrix.openssl.version }}
        FIPS: 'true'
    - name: Verify the compiled binary runs
      shell: bash
      run: |
        set -e
        # The shared binary must run against its own libraries, so point
        # LD_LIBRARY_PATH at the directory holding libcrypto.so.3 (the parent
        # of the fips.so directory) like the FIPS test job does.
        MODULES_DIR="$(find openssl/openssl_v${{ matrix.openssl.version }} -name fips.so -printf '%h\n' | head -1)"
        LD_LIBRARY_PATH="$(dirname "${MODULES_DIR}")" openssl/openssl_v${{ matrix.openssl.version }}/bin/openssl version
    - name: Upload FIPS build
      uses: actions/upload-artifact@v4
      with:
        name: openssl_fips_v${{ matrix.openssl.version }}
        path: openssl/openssl_v${{ matrix.openssl.version }}/
        retention-days: 1

  fips:
    name: Test PEM in FIPS mode (Node ${{ matrix.node }}, OpenSSL ${{ matrix.openssl.version }})
    needs: build-fips
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        openssl:
          - version: 3.5.9
    steps:
    - uses: actions/checkout@v7
    - run: |
        sudo apt-get install -y haveged ca-certificates
        sudo haveged -w 2048
    - name: Download FIPS-capable OpenSSL
      uses: actions/download-artifact@v4
      with:
        name: openssl_fips_v${{ matrix.openssl.version }}
        path: openssl
    - name: Install and activate the FIPS provider
      shell: bash
      env:
        OPENSSL_VERSION: ${{ matrix.openssl.version }}
      run: |
        set -e
        set -x
        OPENSSL_DIR="${GITHUB_WORKSPACE}/openssl/openssl_v${OPENSSL_VERSION}"
        OPENSSL_BIN="${OPENSSL_DIR}/bin/openssl"
        FIPS_SO="$(find "${OPENSSL_DIR}" -name fips.so | head -1)"
        # fips.so lives in lib*/ossl-modules, while the shared libcrypto.so.3
        # and libssl.so.3 the openssl binary links against live one level up.
        # LD_LIBRARY_PATH must point at the shared-library directory, or the
        # loader falls back to the runner's older system OpenSSL; the provider
        # directory stays separate for OPENSSL_MODULES.
        MODULES_DIR="$(dirname "${FIPS_SO}")"
        SHLIB_DIR="$(dirname "${MODULES_DIR}")"
        # export for this step's smoke tests ...
        export LD_LIBRARY_PATH="${SHLIB_DIR}"
        # ... and via GITHUB_ENV for all later steps
        echo "LD_LIBRARY_PATH=${SHLIB_DIR}" >> "${GITHUB_ENV}"
        # fipsmodule.cnf does not record a module-path, and Node.js bundles its
        # own libcrypto with a different build prefix, so Node can only locate
        # fips.so through OPENSSL_MODULES.
        echo "OPENSSL_MODULES=${MODULES_DIR}" >> "${GITHUB_ENV}"
        "${OPENSSL_BIN}" fipsinstall -out "${GITHUB_WORKSPACE}/fipsmodule.cnf" -module "${FIPS_SO}"
        # Node.js reads the nodejs_conf section from OpenSSL config files
        # (not openssl_conf, which the OpenSSL CLI reads), so both keys are
        # set to the same section to serve Node.js and the openssl CLI from
        # one configuration file.
        cat > "${GITHUB_WORKSPACE}/fips.cnf" <<EOF
        config_diagnostics = 1
        openssl_conf = openssl_init
        nodejs_conf = openssl_init

        .include ${GITHUB_WORKSPACE}/fipsmodule.cnf

        [openssl_init]
        providers = provider_sect
        alg_section = algorithm_sect

        [provider_sect]
        fips = fips_sect
        base = base_sect

        [base_sect]
        activate = 1

        [algorithm_sect]
        default_properties = fips=yes
        EOF
        # Smoke: MD5 must be rejected and SHA-256 must work under FIPS properties
        export OPENSSL_CONF="${GITHUB_WORKSPACE}/fips.cnf" OPENSSL_MODULES="${MODULES_DIR}"
        echo test | "${OPENSSL_BIN}" dgst -md5 >/dev/null 2>&1 && { echo "MD5 unexpectedly allowed in FIPS mode"; exit 1; }
        echo test | "${OPENSSL_BIN}" dgst -sha256 >/dev/null
    - name: Use Node.js ${{ matrix.node }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
        cache: yarn
    - name: Run Tests in FIPS mode
      shell: bash
      run: |
        yarn install
        yarn run test
      env:
        LIBRARY: openssl
        VERSION: ${{ matrix.openssl.version }}
        OPENSSL_BIN: ${{ github.workspace }}/openssl/openssl_v${{ matrix.openssl.version }}/bin/openssl
        OPENSSL_CONF: ${{ github.workspace }}/fips.cnf
        OPENSSL_MODULES: ${{ env.OPENSSL_MODULES }}
        PEM_TEST_FIPS: 'true'
