name: Test PEM module
on:
  push:
    branches:
      - '*'
    pull_request:
      - '*'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  TARGET: x86_64-unknown-linux-gnu
  DEBUG: true
jobs:
  build:
    name: Build and Test PEM
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        library:
          - name: openssl
            version: 0.9.8zh
          - name: openssl
            version: 1.0.1u
          - name: openssl
            version: 1.0.2u
          - name: openssl
            version: 1.1.0l
          - name: openssl
            version: 1.1.1l
          - name: openssl
            version: 3.0.8
          - name: openssl
            version: 3.1.0
          - name: libressl
            version: 2.4.5
          - name: libressl
            version: 2.5.5
          - name: libressl
            version: 2.6.5
          - name: libressl
            version: 2.7.5
          - name: libressl
            version: 2.8.3
          - name: libressl
            version: 2.9.2
          - name: libressl
            version: 3.0.2
          - name: libressl
            version: 3.1.5
          - name: libressl
            version: 3.2.7
          - name: libressl
            version: 3.3.5
          - name: libressl
            version: 3.4.2
    steps:
    - uses: actions/checkout@v7
    - run: |
        sudo apt-get install -y haveged ca-certificates
        sudo haveged -w 2048
        mkdir -p openssl
    - name: Compile ${{ matrix.library.name }} ${{ matrix.library.version }}
      shell: bash
      run: |
        set +e
        set -x
        echo $PWD
        openssl version
        ./bin/build-openssl.sh
      env:
        LIBRARY: ${{ matrix.library.name }}
        VERSION: ${{ matrix.library.version }}
    - name: Use Node.js ${{ matrix.node }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
        cache: yarn
    - name: Run Tests
      shell: bash
      run: |
        yarn install
        yarn run test
      env:
        LIBRARY: ${{ matrix.library.name }}
        VERSION: ${{ matrix.library.version }}

  fips:
    name: Test PEM in FIPS mode (Node ${{ matrix.node }}, OpenSSL ${{ matrix.openssl.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        openssl:
          - version: 3.5.9
    steps:
    - uses: actions/checkout@v7
    - run: |
        sudo apt-get install -y haveged ca-certificates
        sudo haveged -w 2048
        mkdir -p openssl
    - name: Compile FIPS-capable OpenSSL ${{ matrix.openssl.version }}
      shell: bash
      run: |
        set +e
        set -x
        openssl version
        ./bin/build-openssl.sh
      env:
        LIBRARY: openssl
        VERSION: ${{ matrix.openssl.version }}
        FIPS: 'true'
    - name: Install and activate the FIPS provider
      shell: bash
      env:
        OPENSSL_VERSION: ${{ matrix.openssl.version }}
      run: |
        set -e
        set -x
        OPENSSL_DIR="${GITHUB_WORKSPACE}/openssl/openssl_v${OPENSSL_VERSION}"
        OPENSSL_BIN="${OPENSSL_DIR}/bin/openssl"
        FIPS_SO="$(find "${OPENSSL_DIR}" -name fips.so | head -1)"
        LIB_DIR="$(dirname "${FIPS_SO}")"
        # export for this step's smoke tests ...
        export LD_LIBRARY_PATH="${LIB_DIR}"
        # ... and via GITHUB_ENV for all later steps
        echo "LD_LIBRARY_PATH=${LIB_DIR}" >> "${GITHUB_ENV}"
        # fipsmodule.cnf does not record a module-path, and Node.js bundles its
        # own libcrypto with a different build prefix, so Node can only locate
        # fips.so through OPENSSL_MODULES.
        echo "OPENSSL_MODULES=${LIB_DIR}" >> "${GITHUB_ENV}"
        "${OPENSSL_BIN}" fipsinstall -out "${GITHUB_WORKSPACE}/fipsmodule.cnf" -module "${FIPS_SO}"
        # Node.js reads the nodejs_conf section from OpenSSL config files
        # (not openssl_conf, which the OpenSSL CLI reads), so both keys are
        # set to the same section to serve Node.js and the openssl CLI from
        # one configuration file.
        cat > "${GITHUB_WORKSPACE}/fips.cnf" <<EOF
        config_diagnostics = 1
        openssl_conf = openssl_init
        nodejs_conf = openssl_init

        .include ${GITHUB_WORKSPACE}/fipsmodule.cnf

        [openssl_init]
        providers = provider_sect
        alg_section = algorithm_sect

        [provider_sect]
        fips = fips_sect
        base = base_sect

        [base_sect]
        activate = 1

        [algorithm_sect]
        default_properties = fips=yes
        EOF
        # Smoke: MD5 must be rejected and SHA-256 must work under FIPS properties
        export OPENSSL_CONF="${GITHUB_WORKSPACE}/fips.cnf" OPENSSL_MODULES="${LIB_DIR}"
        echo test | "${OPENSSL_BIN}" dgst -md5 >/dev/null 2>&1 && { echo "MD5 unexpectedly allowed in FIPS mode"; exit 1; }
        echo test | "${OPENSSL_BIN}" dgst -sha256 >/dev/null
    - name: Use Node.js ${{ matrix.node }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
        cache: yarn
    - name: Run Tests in FIPS mode
      shell: bash
      run: |
        yarn install
        yarn run test
      env:
        LIBRARY: openssl
        VERSION: ${{ matrix.openssl.version }}
        OPENSSL_BIN: ${{ github.workspace }}/openssl/openssl_v${{ matrix.openssl.version }}/bin/openssl
        OPENSSL_CONF: ${{ github.workspace }}/fips.cnf
        OPENSSL_MODULES: ${{ env.OPENSSL_MODULES }}
        PEM_TEST_FIPS: 'true'
